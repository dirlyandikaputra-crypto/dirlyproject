<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Masuk</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="simple-header">

    <a href="index.html" class="brand">

        <span class="ms-logo">
            <i></i><i></i><i></i><i></i>
        </span>

        Microsoft

    </a>


    <nav>

        <a href="index.html">
            Beranda
        </a>

        <a href="support.html">
            Dukungan
        </a>

    </nav>

</header>


<main class="page">

    <div class="page-content">

        <p class="eyebrow">
            AKUN
        </p>

        <h1>
            Masuk
        </h1>

        <p class="lead">
            Masuk ke akun demo website kamu.
        </p>


        <form
            class="demo-form"
            onsubmit="demoSubmit(event)"
        >

            <label>
                Email
            </label>

            <input
                type="email"
                placeholder="nama@email.com"
                required
            >


            <label>
                Kata sandi
            </label>

            <input
                type="password"
                placeholder="Kata sandi"
                required
            >


            <button
                type="submit"
                class="blue-btn"
            >
                Masuk
            </button>

        </form>


        <p class="small-note">
            Ini hanya halaman demo lokal untuk project.
        </p>

    </div>

</main>


<footer>

    <a href="index.html">
        Kembali ke Beranda
    </a>

</footer>


<script src="script.js"></script>

</body>
</html>
